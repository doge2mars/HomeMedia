# HomeMedia — bind-mount deployment (no Docker named volumes, by design:
# the project directory stays self-contained; back up the directory itself).
#
# Quick start:
#   cp .env.example .env        # then edit it (secret, admin password, PUID/PGID, port)
#   mkdir -p data               # create it yourself, as the user that will own it
#   docker compose up -d --build
#
# The container runs as PUID:PGID (default 1000:1000) so files under ./data belong to
# your own account (on fnOS/NAS: visible and deletable from the file manager / SMB).
# Check yours with `id -u` / `id -g`. If ./data does not exist yet, Docker creates it
# as root and the non-root container can't write to it — create it first.
services:
  home-media:
    build: .
    container_name: home-media
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # host port : container port (the app listens on 8080 inside the container)
      - "${HOME_MEDIA_HOST_PORT:-8090}:8080"
    volumes:
      # SQLite library, poster cache and segment cache all live under /data.
      # On a NAS, point HOME_MEDIA_DATA_DIR at the big disk in .env, e.g.
      #   HOME_MEDIA_DATA_DIR=/vol1/1000/docker/home-media/data
      - ${HOME_MEDIA_DATA_DIR:-./data}:/data
    environment:
      - HOME_MEDIA_PORT=8080
      - HOME_MEDIA_DATA=/data
      - HOME_MEDIA_SECRET=${HOME_MEDIA_SECRET:-}
      - HOME_MEDIA_ADMIN_PASS=${HOME_MEDIA_ADMIN_PASS:-}
      - HOME_MEDIA_IMAGE_PROXIES=${HOME_MEDIA_IMAGE_PROXIES:-}
